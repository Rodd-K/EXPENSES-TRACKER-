<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Money Cash Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <h1 class="login-title">Ledger</h1>
      <p class="login-tagline">Sign in to see your entries.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginName">Name</label>
          <input type="text" id="loginName" name="loginName" placeholder="e.g. Roy" required autocomplete="username">
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <p id="loginError" class="login-error" hidden>Wrong name or password. Try again.</p>

        <button type="submit" class="btn-primary login-submit">Log in</button>
      </form>

      <p class="login-hint">
        Demo accounts for this lesson: <code>admin / admin123</code> or <code>student / student123</code>
      </p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
