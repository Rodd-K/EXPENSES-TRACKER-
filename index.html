<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="ledger-header">
      <div class="header-top">
        <h1>Ledger</h1>
        <p class="tagline">A running record of where the money goes.</p>
      </div>
      <div class="total-box">
        <span class="total-label">Balance this month</span>
        <span class="total-amount" id="totalAmount">KSh 0</span>
      </div>
    </header>

    <section class="entry-form-section">
      <form id="entryForm">
        <input type="hidden" id="editingId" value="">

        <div class="field-row">
          <div class="field">
            <label for="title">What was it</label>
            <input type="text" id="title" name="title" placeholder="e.g. Lunch, Uber, Rent" required>
          </div>
          <div class="field field-amount">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="0" min="0" step="1" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn-primary">Add entry</button>
          <button type="button" id="cancelEditBtn" class="btn-text" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="entries-section">
      <div class="entries-heading">
        <span>Date</span>
        <span>Description</span>
        <span>Category</span>
        <span class="align-right">Amount</span>
        <span class="align-right">Actions</span>
      </div>

      <div id="entriesList" class="entries-list">
        <!-- Rows are rendered here by app.js -->
      </div>

      <p id="emptyState" class="empty-state" hidden>
        No entries yet. Add your first expense above — it'll show up here.
      </p>
    </section>

    <footer class="page-footer">
      <p>Frontend only for now — entries live in the browser and reset on reload. Backend comes next.</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
